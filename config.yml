baseURL: "https://frameworked.org/"
title: Frameworked
languageCode: en-us
theme: PaperMod
contentDir: site-content
enableRobotsTXT: true
taxonomies:
  series: series
buildDrafts: false
params:
  description: "Exploring chemistry, one building block at a time. Rooted in metal-organic framework research and scientific curiosity."
  author: Frameworked
  startSeries: introduction-to-mofs
  uiVersion: "0.1.4" # Channel avatar source reliability fix
markup:
  goldmark:
    renderer:
      unsafe: false
  tableOfContents:
    startLevel: 2
    endLevel: 2

# Hugo restricts template environment access by default. Permit only the
# Cloudflare Pages build commit SHA, retaining Hugo's standard safe variables.
security:
  funcs:
    getenv:
      - "^HUGO_"
      - "^CI$"
      - "^CF_PAGES_COMMIT_SHA$"
