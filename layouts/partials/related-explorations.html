{{ with index site.Data.tool_relations .RelPermalink }}
<nav class="tool-related" aria-label="Continue exploring">
  <h2>Continue exploring.</h2>
  <div class="tool-related-links">
    {{ range . }}
    <a href="{{ .url }}">
      <strong>{{ .title }}</strong>
      <span>{{ .description }}</span>
      <span class="tool-related-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M5 19 19 5M8 5h11v11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>
    {{ end }}
  </div>
</nav>
{{ end }}
