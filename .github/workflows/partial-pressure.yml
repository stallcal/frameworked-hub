name: Partial-pressure model tests
on:
  pull_request:
    paths: ['assets/gas-explorer/pressure-model.mjs', 'assets/gas-explorer/partial-pressure.js', 'tests/partial-pressure.test.mjs', '.github/workflows/partial-pressure.yml']
  push:
    branches: [main]
    paths: ['assets/gas-explorer/pressure-model.mjs', 'assets/gas-explorer/partial-pressure.js', 'tests/partial-pressure.test.mjs', '.github/workflows/partial-pressure.yml']
permissions:
  contents: read
jobs:
  model-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/partial-pressure.test.mjs
