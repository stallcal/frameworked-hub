name: Wave interference explorer validation

on:
  pull_request:
    paths:
      - 'static/tools/wave-interference/**'
      - 'tests/wave-interference.test.mjs'
      - 'layouts/tools/list.html'
      - 'layouts/partials/tool-link.html'
      - '.github/workflows/wave-interference.yml'
  push:
    branches: [main]
    paths:
      - 'static/tools/wave-interference/**'
      - 'tests/wave-interference.test.mjs'
      - 'layouts/tools/list.html'
      - 'layouts/partials/tool-link.html'
      - '.github/workflows/wave-interference.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check static/tools/wave-interference/model.mjs
          node --check static/tools/wave-interference/app.mjs
      - name: Validate wave physics and UI integration
        run: node --test tests/wave-interference.test.mjs
