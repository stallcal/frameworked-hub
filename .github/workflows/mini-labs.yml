name: Quantum and chemistry mini labs
on:
  pull_request:
    paths: ['assets/labs/**', 'layouts/partials/labs/**', 'layouts/tools/mini-lab.html', 'site-content/tools/**', 'tests/mini-labs.test.mjs', '.github/workflows/mini-labs.yml']
  push:
    branches: [main]
    paths: ['assets/labs/**', 'tests/mini-labs.test.mjs', '.github/workflows/mini-labs.yml']
permissions:
  contents: read
jobs:
  science-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/mini-labs.test.mjs
